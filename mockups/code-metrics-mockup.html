<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📊 Code Metrics — Heatmap + Leaderboard</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',sans-serif;background:#0a0a12;color:#e2e8f0;min-height:100vh;padding:32px;overflow-x:hidden}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08);border-radius:3px}
.container{max-width:960px;margin:0 auto}
h1{font-size:26px;font-weight:700;letter-spacing:-0.5px;background:linear-gradient(135deg,#60a5fa,#3b82f6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px}
.subtitle{color:rgba(255,255,255,0.35);font-size:14px;margin-bottom:24px}

/* Stats */
.stats{display:flex;gap:12px;margin-bottom:28px;flex-wrap:wrap}
.stat{border-radius:14px;padding:14px 24px;text-align:center;min-width:100px;cursor:default;transition:all 0.3s cubic-bezier(0.4,0,0.2,1);opacity:0;animation:fadeUp 0.4s forwards}
.stat:hover{transform:translateY(-3px) scale(1.05)!important;box-shadow:0 8px 24px rgba(0,0,0,0.3)}
.stat-val{font-size:28px;font-weight:800;line-height:1}
.stat-lbl{font-size:10px;color:rgba(255,255,255,0.4);text-transform:uppercase;letter-spacing:0.8px;margin-top:6px;font-weight:600}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* View Switcher */
.view-sw{display:flex;gap:4px;background:rgba(0,0,0,0.4);padding:4px;borderRadius:14px;border:1px solid rgba(255,255,255,0.06);margin-bottom:24px;border-radius:14px}
.view-btn{flex:1;padding:10px 16px;border-radius:10px;border:none;cursor:pointer;font-family:inherit;font-size:14px;font-weight:600;background:transparent;color:rgba(255,255,255,0.35);transition:all 0.25s}
.view-btn.active{background:rgba(10,132,255,0.2);color:#60a5fa}
.view-btn:hover{color:#60a5fa}

/* Section */
.section{margin-bottom:32px}
.section-title{font-size:16px;font-weight:700;color:rgba(255,255,255,0.7);margin-bottom:16px;display:flex;align-items:center;gap:8px}

/* Heatmap */
.heatmap{overflow-x:auto;padding-bottom:8px}
.hm-row{display:flex;align-items:center;gap:0;margin-bottom:2px}
.hm-label{width:120px;font-size:11px;color:rgba(255,255,255,0.5);text-align:right;padding-right:10px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;transition:color 0.2s}
.hm-label:hover{color:#60a5fa}
.hm-cell{width:14px;height:14px;border-radius:3px;margin:1px;transition:all 0.2s;cursor:pointer;opacity:0;animation:cellPop 0.15s forwards}
.hm-cell:hover{transform:scale(1.8);z-index:10;box-shadow:0 0 8px rgba(48,209,88,0.5)}
@keyframes cellPop{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}
.hm-weeks{display:flex;margin-left:120px;margin-bottom:4px}
.hm-wk{width:16px;text-align:center;font-size:8px;color:rgba(255,255,255,0.15)}
.hm-legend{display:flex;align-items:center;gap:6px;margin-top:12px;margin-left:120px;font-size:10px;color:rgba(255,255,255,0.25)}
.hm-legend-cell{width:12px;height:12px;border-radius:2px}

/* Tooltip */
.tooltip{position:fixed;background:rgba(15,15,25,0.95);border:1px solid rgba(255,255,255,0.1);border-radius:10px;padding:10px 14px;font-size:12px;color:#e2e8f0;pointer-events:none;z-index:100;box-shadow:0 8px 24px rgba(0,0,0,0.5);display:none;max-width:220px}
.tooltip-name{font-weight:700;color:#60a5fa;margin-bottom:4px}
.tooltip-week{color:rgba(255,255,255,0.4);font-size:10px;margin-bottom:6px}
.tooltip-stats{display:flex;gap:12px}
.tooltip-stat{text-align:center}
.tooltip-stat-val{font-size:16px;font-weight:700}
.tooltip-stat-lbl{font-size:9px;color:rgba(255,255,255,0.35);text-transform:uppercase}

/* Leaderboard */
.lb-row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:14px;margin-bottom:6px;background:rgba(22,22,30,0.6);border:1px solid rgba(255,255,255,0.04);cursor:pointer;transition:all 0.25s;opacity:0;animation:springIn 0.5s forwards}
.lb-row:hover{background:rgba(255,255,255,0.03);transform:translateX(4px);box-shadow:0 4px 16px rgba(0,0,0,0.2)}
.lb-row.declining{border-left:3px solid #ff9f0a;background:rgba(255,159,10,0.04)}
.lb-rank{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex-shrink:0}
.lb-rank-1{background:linear-gradient(135deg,#fbbf24,#d97706);color:#000}.lb-rank-2{background:linear-gradient(135deg,#94a3b8,#64748b);color:#000}.lb-rank-3{background:linear-gradient(135deg,#cd7f32,#8b5e3c);color:#fff}
.lb-rank-n{background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.3)}
.lb-avatar{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,0.2)}
.lb-info{flex:1;min-width:0}
.lb-name{font-size:14px;font-weight:600;color:rgba(255,255,255,0.9)}.lb-alias{font-size:11px;color:rgba(255,255,255,0.3);margin-top:1px}
.lb-bar-wrap{flex:2;display:flex;align-items:center;gap:8px}
.lb-bar-bg{height:20px;background:rgba(255,255,255,0.04);border-radius:4px;flex:1;overflow:hidden;position:relative}
.lb-bar{height:100%;border-radius:4px;display:flex;align-items:center;padding-left:8px;font-size:10px;font-weight:700;color:#fff;min-width:24px;transition:width 1s cubic-bezier(0.4,0,0.2,1)}
.lb-bar-created{background:linear-gradient(90deg,rgba(10,132,255,0.7),rgba(10,132,255,0.35))}
.lb-bar-reviewed{background:linear-gradient(90deg,rgba(48,209,88,0.7),rgba(48,209,88,0.35))}
.lb-ratio{width:50px;text-align:center;font-weight:700;font-size:13px;flex-shrink:0}
.lb-delta{font-size:10px;font-weight:600;margin-left:4px}
.lb-sparkline{display:flex;gap:1px;align-items:flex-end;height:20px;flex-shrink:0}
.lb-spark{width:4px;border-radius:1px;transition:height 0.4s ease-out}
.lb-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:6px;flex-shrink:0}

@keyframes springIn{0%{opacity:0;transform:translateY(15px) scale(0.98)}70%{transform:translateY(-2px) scale(1.003)}100%{opacity:1;transform:translateY(0) scale(1)}}
.footer{text-align:center;padding:24px 0;font-size:11px;color:rgba(255,255,255,0.15)}
</style>
</head>
<body>
<div class="container" id="app"></div>
<div class="tooltip" id="tip"></div>
<script>
// ─── Sample Data ───
const ENGINEERS = [
    { alias: 'nsantosh', name: 'Naren Santosh', team: 'Classification' },
    { alias: 'vkarthik', name: 'Vikram Karthik', team: 'ML Platform' },
    { alias: 'devikap', name: 'Devika Patel', team: 'Automation' },
    { alias: 'priyar', name: 'Priya Raghavan', team: 'Classification' },
    { alias: 'amitg', name: 'Amit Gupta', team: 'Reliability' },
    { alias: 'mikeb', name: 'Mike Brown', team: 'Latency' },
    { alias: 'lisam', name: 'Lisa Martinez', team: 'Migration' },
    { alias: 'tomw', name: 'Tom Wilson', team: 'Compliance' },
    { alias: 'rajeshm', name: 'Rajesh Menon', team: 'Performance' },
    { alias: 'dineshk', name: 'Dinesh Kumar', team: 'Self-Service' },
    { alias: 'alexj', name: 'Alex Johnson', team: 'Latency' },
    { alias: 'chenw', name: 'Chen Wei', team: 'ML Accuracy' },
    { alias: 'rameshv', name: 'Ramesh Venkat', team: 'ML Platform' },
    { alias: 'mariak', name: 'Maria Kowalski', team: 'Compliance' },
];

// Generate 12 weeks of random data per engineer
const WEEKS = Array.from({length:12},(_,i)=>`W${String(i+1).padStart(2,'0')}`);
const DATA = {};
ENGINEERS.forEach(e=>{
    const base = 3 + Math.floor(Math.random()*6);
    const declining = Math.random() < 0.15;
    DATA[e.alias] = WEEKS.map((w,wi)=>{
        const trend = declining ? Math.max(0, base - wi*0.5) : base + Math.sin(wi*0.7)*2;
        const created = Math.max(0, Math.round(trend + (Math.random()-0.5)*4));
        const reviewed = Math.max(0, Math.round(created * (1.0 + Math.random()*1.2)));
        return { week: w, created, reviewed };
    });
});

const GRADS = ['linear-gradient(135deg,#4f8cff,#3b6fd4)','linear-gradient(135deg,#a855f7,#7c3aed)','linear-gradient(135deg,#34d399,#059669)','linear-gradient(135deg,#fb923c,#ea580c)','linear-gradient(135deg,#22d3ee,#0891b2)','linear-gradient(135deg,#f472b6,#db2777)','linear-gradient(135deg,#fbbf24,#d97706)','linear-gradient(135deg,#818cf8,#6366f1)','linear-gradient(135deg,#ef4444,#b91c1c)','linear-gradient(135deg,#14b8a6,#0d9488)'];

let currentView = 'heatmap';
let heatMetric = 'created'; // 'created' | 'reviewed' | 'total'

function getColor(val, max) {
    if (val === 0) return 'rgba(255,255,255,0.03)';
    const pct = Math.min(val / Math.max(max, 1), 1);
    if (pct < 0.25) return 'rgba(48,209,88,0.15)';
    if (pct < 0.5) return 'rgba(48,209,88,0.35)';
    if (pct < 0.75) return 'rgba(48,209,88,0.6)';
    return 'rgba(48,209,88,0.9)';
}

function render() {
    const app = document.getElementById('app');
    const totalCreated = Object.values(DATA).reduce((s,d)=>s+d[d.length-1].created,0);
    const totalReviewed = Object.values(DATA).reduce((s,d)=>s+d[d.length-1].reviewed,0);
    const avgRatio = totalCreated > 0 ? (totalReviewed/totalCreated).toFixed(1) : '—';

    let h = `<h1>📊 Code Metrics</h1><p class="subtitle">Engineer Activity Heatmap + Animated Leaderboard · ${ENGINEERS.length} engineers · 12 weeks</p>`;

    // Stats
    const stats = [
        {l:'Engineers',v:ENGINEERS.length,c:'#60a5fa',bg:'rgba(10,132,255,0.08)',b:'rgba(10,132,255,0.15)'},
        {l:'CRs This Week',v:totalCreated,c:'#0a84ff',bg:'rgba(10,132,255,0.08)',b:'rgba(10,132,255,0.15)'},
        {l:'Reviews',v:totalReviewed,c:'#30d158',bg:'rgba(48,209,88,0.08)',b:'rgba(48,209,88,0.15)'},
        {l:'Org Ratio',v:avgRatio+'×',c:parseFloat(avgRatio)>=1.5?'#30d158':'#ff9f0a',bg:parseFloat(avgRatio)>=1.5?'rgba(48,209,88,0.08)':'rgba(255,159,10,0.08)',b:parseFloat(avgRatio)>=1.5?'rgba(48,209,88,0.15)':'rgba(255,159,10,0.15)'},
    ];
    h += '<div class="stats">';
    stats.forEach((s,i)=>{h+=`<div class="stat" style="background:${s.bg};border:1px solid ${s.b};animation-delay:${i*0.06}s"><div class="stat-val" style="color:${s.c}">${s.v}</div><div class="stat-lbl">${s.l}</div></div>`;});
    h += '</div>';

    // View Switcher
    h += '<div class="view-sw">';
    [{id:'heatmap',l:'🔥 Activity Heatmap'},{id:'leaderboard',l:'🏆 Leaderboard'},{id:'both',l:'📊 Combined'}].forEach(v=>{
        h+=`<button class="view-btn ${currentView===v.id?'active':''}" onclick="currentView='${v.id}';render()">${v.l}</button>`;
    });
    h += '</div>';

    // ─── HEATMAP ───
    if (currentView === 'heatmap' || currentView === 'both') {
        h += '<div class="section"><div class="section-title">🔥 Engineer Activity Heatmap <span style="font-size:11px;color:rgba(255,255,255,0.25);font-weight:400;margin-left:8px">(hover for details)</span></div>';

        // Metric toggle
        h += '<div style="display:flex;gap:4px;margin-bottom:12px;margin-left:120px">';
        [{id:'created',l:'CRs Created',c:'#0a84ff'},{id:'reviewed',l:'CRs Reviewed',c:'#30d158'},{id:'total',l:'Total Activity',c:'#a78bfa'}].forEach(m=>{
            h+=`<button onclick="heatMetric='${m.id}';render()" style="padding:4px 12px;border-radius:6px;border:none;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;background:${heatMetric===m.id?m.c+'20':'transparent'};color:${heatMetric===m.id?m.c:'rgba(255,255,255,0.3)'};transition:all 0.2s">${m.l}</button>`;
        });
        h += '</div>';

        // Week labels
        h += '<div class="hm-weeks">';
        WEEKS.forEach(w=>{h+=`<div class="hm-wk">${w.replace('W','')}</div>`;});
        h += '</div>';

        // Find max for color scaling
        let maxVal = 0;
        ENGINEERS.forEach(e=>{DATA[e.alias].forEach(d=>{
            const v = heatMetric==='created'?d.created:heatMetric==='reviewed'?d.reviewed:d.created+d.reviewed;
            if(v>maxVal) maxVal=v;
        })});

        // Rows
        h += '<div class="heatmap">';
        // Sort by current week's metric (descending)
        const sorted = [...ENGINEERS].sort((a,b)=>{
            const da=DATA[a.alias], db=DATA[b.alias];
            const va=heatMetric==='created'?da[da.length-1].created:heatMetric==='reviewed'?da[da.length-1].reviewed:da[da.length-1].created+da[da.length-1].reviewed;
            const vb=heatMetric==='created'?db[db.length-1].created:heatMetric==='reviewed'?db[db.length-1].reviewed:db[db.length-1].created+db[db.length-1].reviewed;
            return vb-va;
        });

        sorted.forEach((e,ei)=>{
            h += `<div class="hm-row">`;
            h += `<div class="hm-label" title="${e.name} (${e.alias})">${e.name}</div>`;
            DATA[e.alias].forEach((d,wi)=>{
                const v = heatMetric==='created'?d.created:heatMetric==='reviewed'?d.reviewed:d.created+d.reviewed;
                const color = getColor(v, maxVal);
                h += `<div class="hm-cell" style="background:${color};animation-delay:${(ei*WEEKS.length+wi)*0.008}s" data-name="${e.name}" data-alias="${e.alias}" data-week="${d.week}" data-created="${d.created}" data-reviewed="${d.reviewed}" onmouseenter="showTip(event,this)" onmouseleave="hideTip()"></div>`;
            });
            // Sparkline mini at end
            const vals = DATA[e.alias].map(d=>heatMetric==='created'?d.created:heatMetric==='reviewed'?d.reviewed:d.created+d.reviewed);
            const sparkMax = Math.max(...vals,1);
            h += '<div style="display:flex;gap:1px;align-items:flex-end;height:14px;margin-left:8px">';
            vals.forEach((v,si)=>{
                const hh = Math.max(2, (v/sparkMax)*14);
                const isLast = si===vals.length-1;
                h += `<div style="width:3px;height:${hh}px;border-radius:1px;background:${isLast?'rgba(48,209,88,0.7)':'rgba(10,132,255,0.4)'}"></div>`;
            });
            h += '</div>';
            h += '</div>';
        });
        h += '</div>';

        // Legend
        h += '<div class="hm-legend">';
        h += '<span>Less</span>';
        ['rgba(255,255,255,0.03)','rgba(48,209,88,0.15)','rgba(48,209,88,0.35)','rgba(48,209,88,0.6)','rgba(48,209,88,0.9)'].forEach(c=>{
            h+=`<div class="hm-legend-cell" style="background:${c}"></div>`;
        });
        h += '<span>More</span></div>';
        h += '</div>';
    }

    // ─── LEADERBOARD ───
    if (currentView === 'leaderboard' || currentView === 'both') {
        h += '<div class="section"><div class="section-title">🏆 Engineer Leaderboard <span style="font-size:11px;color:rgba(255,255,255,0.25);font-weight:400;margin-left:8px">(current week · animated bars)</span></div>';

        const maxCreated = Math.max(...ENGINEERS.map(e=>DATA[e.alias][DATA[e.alias].length-1].created),1);
        const maxReviewed = Math.max(...ENGINEERS.map(e=>DATA[e.alias][DATA[e.alias].length-1].reviewed),1);
        const maxTotal = Math.max(maxCreated, maxReviewed);

        // Sort by CRs created (descending)
        const lbSorted = [...ENGINEERS].sort((a,b)=>{
            return DATA[b.alias][DATA[b.alias].length-1].created - DATA[a.alias][DATA[a.alias].length-1].created;
        });

        lbSorted.forEach((e,i)=>{
            const d = DATA[e.alias];
            const cur = d[d.length-1];
            const prev = d[d.length-2];
            const ratio = cur.created > 0 ? (cur.reviewed/cur.created).toFixed(1) : '∞';
            const ratioColor = parseFloat(ratio)>=1.5?'#30d158':parseFloat(ratio)>=1.0?'#ff9f0a':'#ff453a';
            const delta = cur.created - (prev?.created||0);
            const deltaColor = delta > 0 ? '#30d158' : delta < 0 ? '#ff453a' : 'rgba(255,255,255,0.25)';
            const declining = d.length >= 4 && d[d.length-4].created > d[d.length-3].created && d[d.length-3].created > d[d.length-2].created && d[d.length-2].created > cur.created;
            const grad = GRADS[e.alias.charCodeAt(0) % GRADS.length];
            const init = e.name[0];
            const rankClass = i===0?'lb-rank-1':i===1?'lb-rank-2':i===2?'lb-rank-3':'lb-rank-n';
            const createdW = Math.max(24, (cur.created/maxTotal)*100);
            const reviewedW = Math.max(24, (cur.reviewed/maxTotal)*100);

            // Sparkline data
            const sparkVals = d.map(w=>w.created);
            const sparkMax = Math.max(...sparkVals,1);

            h += `<div class="lb-row ${declining?'declining':''}" style="animation-delay:${i*0.06}s">`;
            h += `<div class="lb-rank ${rankClass}">${i+1}</div>`;
            h += `<div class="lb-avatar" style="background:${grad}">${init}</div>`;
            h += `<div class="lb-info"><div class="lb-name">${e.name}${declining?'<span class="lb-badge" style="background:rgba(255,159,10,0.12);color:#ff9f0a;margin-left:8px">⚠️ 3w decline</span>':''}</div><div class="lb-alias">${e.alias} · ${e.team}</div></div>`;

            // Dual bar
            h += '<div class="lb-bar-wrap">';
            h += '<div class="lb-bar-bg">';
            h += `<div class="lb-bar lb-bar-created" style="width:0%;animation:barGrow 0.8s ${0.3+i*0.06}s forwards" data-target="${createdW}">${cur.created}</div>`;
            h += '</div>';
            h += '<div class="lb-bar-bg">';
            h += `<div class="lb-bar lb-bar-reviewed" style="width:0%;animation:barGrow 0.8s ${0.4+i*0.06}s forwards" data-target="${reviewedW}">${cur.reviewed}</div>`;
            h += '</div>';
            h += '</div>';

            // Ratio
            h += `<div class="lb-ratio" style="color:${ratioColor}">${ratio}×</div>`;

            // Delta
            h += `<span class="lb-delta" style="color:${deltaColor}">${delta>0?'▲ +'+delta:delta<0?'▼ '+delta:'—'}</span>`;

            // Sparkline
            h += '<div class="lb-sparkline">';
            sparkVals.forEach((v,si)=>{
                const sh = Math.max(2,(v/sparkMax)*20);
                const isLast = si===sparkVals.length-1;
                h+=`<div class="lb-spark" style="height:${sh}px;background:${isLast?'rgba(48,209,88,0.7)':'rgba(10,132,255,0.4)'}"></div>`;
            });
            h += '</div>';

            h += '</div>';
        });

        // Legend
        h += '<div style="display:flex;gap:20px;margin-top:12px;font-size:11px;color:rgba(255,255,255,0.3)">';
        h += '<span><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:rgba(10,132,255,0.6);vertical-align:middle;margin-right:4px"></span>CRs Created</span>';
        h += '<span><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:rgba(48,209,88,0.5);vertical-align:middle;margin-right:4px"></span>CRs Reviewed</span>';
        h += '</div>';
        h += '</div>';
    }

    h += '<div class="footer">Mockup · Pure CSS animations · Heatmap + Animated Leaderboard</div>';
    app.innerHTML = h;

    // Animate bars after render
    requestAnimationFrame(()=>{
        document.querySelectorAll('.lb-bar').forEach(bar=>{
            const target = bar.dataset.target;
            if(target) setTimeout(()=>{bar.style.width=target+'%';},100);
        });
    });
}

// Tooltip
function showTip(evt, el) {
    const tip = document.getElementById('tip');
    tip.innerHTML = `<div class="tooltip-name">${el.dataset.name}</div><div class="tooltip-week">${el.dataset.alias} · ${el.dataset.week}</div><div class="tooltip-stats"><div class="tooltip-stat"><div class="tooltip-stat-val" style="color:#0a84ff">${el.dataset.created}</div><div class="tooltip-stat-lbl">Created</div></div><div class="tooltip-stat"><div class="tooltip-stat-val" style="color:#30d158">${el.dataset.reviewed}</div><div class="tooltip-stat-lbl">Reviewed</div></div></div>`;
    tip.style.display = 'block';
    tip.style.left = (evt.clientX + 16) + 'px';
    tip.style.top = (evt.clientY - 10) + 'px';
}
function hideTip() { document.getElementById('tip').style.display = 'none'; }

render();
</script>
</body>
</html>
